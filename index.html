<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRJ MOTORS - Авто из Китая</title>
    
    <!-- Подключение шрифта Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Подключение иконок FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Фирменные цвета */
            --bg-dark: #070707;
            --bg-panel: #111111;
            --neon-green: #bfff00; 
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ================================
           ВЕРХНЯЯ ПАНЕЛЬ (TOP BAR)
           ================================ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px; /* Добавлено больше воздуха */
            background-color: var(--bg-panel);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }

        /* Левая часть: График и Адрес (строго слева) */
        .top-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            flex: 1; /* Занимает ровно треть пространства */
            justify-content: flex-start;
            font-size: 11px; /* Сделано немного меньше */
            font-weight: 600;
        }

        .top-info i {
            color: var(--neon-green);
            margin-right: 5px;
        }

        .top-info .divider {
            color: #333;
        }

        /* Центральная часть: Название (строго по центру) */
        .brand-text {
            flex: 1; /* Занимает ровно треть пространства */
            text-align: center; /* Центрируем текст внутри блока */
            font-size: 18px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .brand-text .highlight {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(191, 255, 0, 0.4); 
        }

        /* Правая часть: Телефон и Соцсети (строго справа) */
        .top-contact {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1; /* Занимает ровно треть пространства */
            justify-content: flex-end;
        }

        .phone-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px; /* Сделано немного меньше */
            font-weight: 800;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .phone-link i {
            color: var(--neon-green);
        }

        .phone-link:hover {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(191, 255, 0, 0.4);
        }

        .socials {
            display: flex;
            gap: 10px;
        }

        .socials a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px; /* Уменьшено для воздуха */
            height: 30px;
            font-size: 14px;
            background-color: transparent;
            color: var(--neon-green); 
            text-decoration: none;
            border-radius: 50%;
            border: 1px solid rgba(191, 255, 0, 0.3); 
            transition: all 0.3s ease;
        }

        .socials a:hover {
            background-color: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(191, 255, 0, 0.6);
            transform: scale(1.1);
        }

        /* ================================
           ГЛАВНОЕ МЕНЮ (MAIN NAVIGATION)
           ================================ */
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px; /* Больше воздуха по краям */
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(191, 255, 0, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
            flex: 1; /* Левая и правая часть занимают равное место */
        }

        /* Ссылки слева жмутся к центру */
        .left-links {
            justify-content: flex-end;
            padding-right: 50px;
        }

        /* Ссылки справа жмутся к центру */
        .right-links {
            justify-content: flex-start;
            padding-left: 50px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            position: relative;
            padding: 8px 0;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            transform: scaleX(0); 
            transform-origin: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-links a:hover {
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(191, 255, 0, 0.4);
        }

        .nav-links a:hover::after {
            transform: scaleX(1);
        }

        /* Логотип строго по центру */
        .nav-logo {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
        }

        .nav-logo img {
            width: 85px;
            height: 85px;
            border-radius: 22px; 
            object-fit: cover;
            border: 2px solid rgba(191, 255, 0, 0.4);
            box-shadow: 0 0 20px rgba(191, 255, 0, 0.3);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .nav-logo img:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 10px 30px rgba(191, 255, 0, 0.7);
            border-color: var(--neon-green);
        }

        /* ================================
           HERO SECTION (ГЛАВНЫЙ ЭКРАН)
           ================================ */
        .hero {
            position: relative;
            height: 85vh; 
            min-height: 600px;
            background: url('srjhero.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(7,7,7,0.9) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 40px;
            color: var(--text-light);
            text-shadow: 0px 5px 25px rgba(0, 0, 0, 0.8);
        }

        .hero h1 span {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(191, 255, 0, 0.5);
        }

        .btn-primary {
            display: inline-block;
            padding: 18px 50px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--bg-dark);
            background-color: var(--neon-green);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(191, 255, 0, 0.4), inset 0 0 10px rgba(255,255,255,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(191, 255, 0, 0.8), inset 0 0 15px rgba(255,255,255,0.6);
            background-color: #ccff33;
        }

        /* ================================
           АДАПТИВНОСТЬ (МОБИЛЬНЫЕ УСТРОЙСТВА)
           ================================ */
        @media (max-width: 1200px) {
            .top-bar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .brand-text {
                order: -1; 
                margin-bottom: 10px;
                flex: auto;
            }
            .top-info, .top-contact {
                flex: auto;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
            }
            .top-contact {
                flex-direction: row;
            }
            .top-info .divider {
                display: none;
            }
            .main-nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
                flex: auto;
            }
            .left-links, .right-links {
                padding: 0;
            }
            .nav-logo {
                order: -1; 
                margin-bottom: 10px;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЕЕ ПОДМЕНЮ (Top Bar) -->
    <div class="top-bar">
        <!-- Левый блок: График и Адрес (строго слева) -->
        <div class="top-info">
            <span><i class="far fa-clock"></i> ПН - ВС 9-18, БЕЗ ВЫХОДНЫХ</span>
            <span class="divider">|</span>
            <span><i class="fas fa-map-marker-alt"></i> г. Минск, ул. Жореса Алферова 14</span>
        </div>

        <!-- Центральный блок: Название (строго по центру) -->
        <div class="brand-text">
            SRJ MOTORS - <span class="highlight">АВТО ИЗ КИТАЯ</span> С ГАРАНТИЕЙ
        </div>

        <!-- Правый блок: Телефон и Соцсети (строго справа) -->
        <div class="top-contact">
            <a href="tel:+375336726666" class="phone-link">
                <i class="fas fa-phone-alt"></i> +375 33 672-66-66
            </a>
            <div class="socials">
                <a href="#" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank" aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
            </div>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ (Main Navigation) -->
    <nav class="main-nav">
        <!-- Левые ссылки -->
        <div class="nav-links left-links">
            <a href="#">Главная</a>
            <a href="#">Каталог</a>
            <a href="#">Калькулятор растаможки</a>
        </div>

        <!-- Центральный логотип (строго по центру) -->
        <div class="nav-logo">
            <a href="#">
                <img src="srjlo-2.png" alt="SRJ Motors Logo">
            </a>
        </div>

        <!-- Правые ссылки -->
        <div class="nav-links right-links">
            <a href="#">О нас</a>
            <a href="#">Отзывы</a>
            <a href="#">Контакты</a>
        </div>
    </nav>

    <!-- ГЛАВНЫЙ ЭКРАН (Hero Section) -->
    <section class="hero">
        <div class="hero-content">
            <h1><span>Китайские авто</span><br>в наличии и под заказ</h1>
            <a href="#callback" class="btn-primary">Заказать звонок</a>
        </div>
    </section>

</body>
</html>
