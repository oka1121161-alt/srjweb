<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за заявку - SRJ MOTORS</title>
    
    <!-- Подключение шрифта Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Подключение иконок FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            var(--bg-dark): #070707;
            --neon-green: #bfff00; 
            --text-light: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #070707;
            color: #f5f5f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, #1a2210 0%, #070707 70%);
            text-align: center;
        }

        .thanks-card {
            background: rgba(16, 16, 16, 0.85);
            border: 1px solid rgba(191, 255, 0, 0.2);
            border-radius: 30px;
            padding: 60px 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(191, 255, 0, 0.05);
            backdrop-filter: blur(15px);
        }

        .success-icon {
            font-size: 60px;
            color: #bfff00;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(191, 255, 0, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #f5f5f5;
        }

        p {
            font-size: 16px;
            color: #8d8d8d;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn-primary {
            display: inline-block; padding: 18px 50px; font-size: 16px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px; color: #070707;
            background-color: #bfff00; border: none; border-radius: 50px;
            text-decoration: none; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(191, 255, 0, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 30px rgba(191, 255, 0, 0.8); background-color: #ccff33;
        }

        @media (max-width: 768px) {
            .thanks-card { padding: 40px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="thanks-card">
        <i class="fas fa-check-circle success-icon"></i>
        <h1>Спасибо за заявку!</h1>
        <p>Ваши данные успешно отправлены. <br>Мы свяжемся с Вами в ближайшее время, чтобы ответить на все вопросы и помочь с выбором автомобиля.</p>
        <a href="index.html" class="btn-primary">Вернуться на главную</a>
    </div>

</body>
</html>
